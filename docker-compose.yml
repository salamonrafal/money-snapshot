name: money-snapshot

services:
  web:
    container_name: money-snapshot-web
    build:
      context: .
      dockerfile: Dockerfile
    image: money-snapshot-web
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY}
      REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-30}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-develop}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://127.0.0.1:$${SERVER_PORT}/login\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: money-snapshot-postgres
    image: postgres:18.4
    ports:
      - "5456:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ${DB_URL}
      APP_DB_NAME: ${APP_DB_NAME:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18 stores PGDATA in a version-specific child directory under
      # /var/lib/postgresql, so the parent directory is the supported mount.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/sql/001_create_database_and_user.sql:/docker-init-source/001_create_database_and_user.sql:ro
      - ./docker/postgres/initdb/001_create_database_and_user.sh:/docker-entrypoint-initdb.d/001_create_database_and_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: money-snapshot-postgres-data
