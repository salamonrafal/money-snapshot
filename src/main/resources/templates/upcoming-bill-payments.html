<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('Nadchodzące płatności | Money Snapshot', 'upcoming-bill-payments.js', 'liabilities-bills')}"></head>
<body>
<header th:replace="~{fragments/page :: header('liabilities')}"></header>
<main class="workspace workspace-with-sticky-launcher">
    <section class="page-heading">
        <p class="eyebrow" data-i18n="home.feature.bills.title">Rachunki</p>
        <h1 id="payments-title" data-i18n="upcomingPayments.title">Nadchodzące płatności</h1>
        <p data-i18n="upcomingPayments.subtitle">Przeglądaj płatności z bieżącego okresu rozliczeniowego i oznaczaj je jako opłacone.</p>
    </section>
    <section class="table-panel wide-panel upcoming-payments-panel" aria-labelledby="payments-title">
        <div class="section-header">
            <div class="section-actions topbar-account-actions icon-toolbar" role="toolbar"
                 data-i18n-aria-label="billSchedule.table.actions" aria-label="Akcje">
                <a href="/bills.html" class="icon-button secondary topbar-icon-link"
                   data-i18n-title="billSchedule.actions.back" data-i18n-aria-label="billSchedule.actions.back" aria-label="Wróć do rachunków">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5"></path>
                        <path d="m12 19-7-7 7-7"></path>
                    </svg>
                </a>
                <button type="button" class="icon-button secondary topbar-icon-link" id="payments-refresh"
                        data-i18n-title="billSchedule.actions.refresh" data-i18n-aria-label="billSchedule.actions.refresh" aria-label="Odśwież harmonogram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>
                    </svg>
                </button>
            </div>
        </div>
        <p class="visually-hidden" id="payments-message" role="status"></p>
        <div class="table-wrap bills-table-wrap">
            <table class="reports-table bill-schedule-table" data-i18n-aria-label="upcomingPayments.title">
                <thead><tr>
                    <th data-i18n="billSchedule.table.dueDate">Termin spłaty</th>
                    <th data-i18n="home.feature.bills.title">Rachunki</th>
                    <th data-i18n="billSchedule.summary.counterparty">Kontrahent</th>
                    <th data-i18n="billSchedule.summary.account">Z konta</th>
                    <th data-i18n="billSchedule.table.amount">Kwota</th>
                    <th data-i18n="billSchedule.table.actions">Akcje</th>
                </tr></thead>
                <tbody id="payments-body"></tbody>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/shortcuts-launcher :: launcherStickyBar}"></th:block>
</body>
</html>
